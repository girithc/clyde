name: publish

# Publish to PyPI on git tags matching v* (e.g. v0.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token required.
# Configure the trusted publisher at https://pypi.org/manage/project/clyde-ai/publishing/
# with workflow filename: publish.yml, environment: pypi.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - name: Check with twine
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
